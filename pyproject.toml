[project]
name = "highlightercs2"
version = "1.5.0"
description = "Find highlight rounds in CS2 demos and record them through HLAE"
requires-python = ">=3.11"
dependencies = [
    "demoparser2>=0.36",
    "pandas>=2.2",
    "rich>=13.7",
]

[project.scripts]
highlightercs2 = "highlighter.application:Application"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
